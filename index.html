<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>提醒小幫手</title>
  <meta name="theme-color" content="#F5F7FB" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0A0F1C" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="提醒小幫手">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
  <main id="login-view" class="view login" hidden>
    <div class="login-card">
      <img class="login-logo" src="icons/icon-192.png" alt="" width="96" height="96">
      <h1>提醒小幫手</h1>
      <p class="muted">用說的，建立 LINE 提醒</p>
      <form id="login-form" autocomplete="on">
        <input type="text" name="username" value="jeff" autocomplete="username" hidden>
        <label class="field">
          <span class="sr-only">密碼</span>
          <input id="password" type="password" placeholder="密碼" autocomplete="current-password" required>
        </label>
        <button id="login-btn" class="btn-primary" type="submit">登入</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </div>
  </main>

  <main id="app-view" class="view app" hidden>
    <header class="topbar">
      <div class="brand">
        <img src="icons/icon-192.png" alt="" width="32" height="32">
        <span>提醒小幫手</span>
      </div>
      <button id="logout-btn" class="icon-btn" type="button" aria-label="登出" title="登出">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5"/><path d="M5 12h11"/></svg>
      </button>
    </header>

    <section class="hero">
      <p class="greet">嗨，<span id="owner-name">Jeff</span></p>
      <p class="hint" id="mic-hint">點一下麥克風，說出要提醒的事</p>
      <div class="mic-wrap">
        <span class="ring r1"></span>
        <span class="ring r2"></span>
        <button id="mic-btn" class="mic" type="button" aria-label="開始對話" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
        </button>
      </div>
      <p class="mic-status" id="mic-status" aria-live="polite"></p>
      <div id="chat" class="chat" aria-live="polite"></div>
      <form id="text-form" class="text-form" autocomplete="off">
        <input id="text-input" type="text" placeholder="也可以打字輸入" enterkeyhint="send">
        <button class="send-btn" type="submit" aria-label="送出">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
        </button>
      </form>
    </section>

    <section class="panel">
      <div id="quota" class="quota" aria-label="本月 LINE 額度"></div>
      <div class="panel-head">
        <div class="seg" role="tablist">
          <button class="seg-btn" role="tab" data-view="reminders" aria-selected="true">提醒事項</button>
          <button class="seg-btn" role="tab" data-view="friends" aria-selected="false">好友與群組</button>
        </div>
        <button id="refresh-btn" class="icon-btn" type="button" aria-label="重新整理" title="重新整理">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg>
        </button>
      </div>

      <div id="reminders-view">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" data-status="待發送" aria-selected="true">待發送 <span class="count"></span></button>
          <button class="tab" role="tab" data-status="已送出" aria-selected="false">已送出 <span class="count"></span></button>
          <button class="tab" role="tab" data-status="失敗" aria-selected="false">失敗 <span class="count"></span></button>
        </div>
        <ul id="reminder-list" class="list"></ul>
        <p id="list-empty" class="empty" hidden></p>
      </div>

      <div id="friends-view" hidden>
        <div id="bot-filter" class="filter" role="tablist"></div>
        <ul id="friend-list" class="list"></ul>
        <p id="friend-empty" class="empty" hidden></p>
        <p class="hint-small">只有加機器人為好友（或把機器人拉進群組）、並傳過訊息的人才會出現在這裡。設定暱稱後，就能用說的指定發給誰。</p>
      </div>
    </section>
    <p class="version">版本 5</p>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="app.js?v=5"></script>
</body>
</html>
